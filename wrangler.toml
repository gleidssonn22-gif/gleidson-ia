name = "gleidson-ia"
main = "worker/index.js"
compatibility_date = "2026-10-27"
routes = [{ pattern = "clubewins.com.br/chat/*", zone_name = "clubewins.com.br" }]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/chat/*"]

[[ratelimits]]
name = "CHAT_LIMITER"
namespace_id = "839271"

[ratelimits.simple]
limit = 10
period = 60

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = false

