[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gleidson-assistant"
version = "0.1.0"
description = "Assistente de IA pessoal do Gleidson"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.30.0"
]

[tool.setuptools.packages.find]
where = ["."]