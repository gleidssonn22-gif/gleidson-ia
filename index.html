<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gleidson IA — Assistente do ClubeWins</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">🎯 ClubeWins</div>
            <h1>Gleidson IA</h1>
            <p class="subtitle">Seu assistente inteligente</p>
        </header>

        <div id="chat-container">
            <div id="messages">
                <div class="message bot">
                    <span class="avatar">🤖</span>
                    <div class="text">Olá! Sou o Gleidson IA. Como posso ajudá-lo hoje?</div>
                </div>
            </div>

            <form id="chat-form">
                <input type="text" id="message-input" placeholder="Digite sua mensagem..." autocomplete="off">
                <button type="submit">Enviar</button>
            </form>
        </div>

        <footer>
            <p>Powered by ClubeWins © 2026</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
