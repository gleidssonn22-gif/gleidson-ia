name: Deploy Gleidson IA to Cloudflare

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
        env:
          UV_NO_MODERN_INSTALL: 1

      - name: Adicionar uv ao PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Instalar dependências Python
        run: uv pip install -r requisitos.txt --system

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar stlite-cloudflare
        run: npm install -g @stlite/cloudflare

      - name: Construir o app
        run: npx stlite-cloudflare build . --entrypoint src/main.py --out ../deploy-dist

      - name: Publicar no Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ../deploy-dist
          command: deploy --yes
